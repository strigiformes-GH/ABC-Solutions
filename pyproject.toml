[project]
name = "abc-solutions-webapp"
version = "1.0.0"
description = "ABC Solutions inventory, sales, customer, and account management application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "Flask-Login>=0.6.3,<1",
  "Flask-SQLAlchemy>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "argon2-cffi>=23.1,<26",
  "pyotp>=2.9,<3",
  "qrcode>=8,<9",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "email-validator>=2.2,<3",
  "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["manual: requires a live deployment, repository pipeline, or authorized external assessment"]

[tool.coverage.run]
branch = true
source = ["app", "services", "models"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.uv]
native-tls = true

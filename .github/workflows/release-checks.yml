# tell GA how to check app before release


name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: abc
          POSTGRES_PASSWORD: abc-ci-password
          POSTGRES_DB: abc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U abc -d abc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-never-use-in-production-123456
      DATABASE_URL: postgresql+psycopg://abc:abc-ci-password@localhost:5432/abc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: flask --app app seed-roles
      - run: pytest -q
      - run: bandit -r app.py config.py database models services -ll
      - run: pip-audit -r requirements.txt
      - run: docker build -t abc-solutions:check .

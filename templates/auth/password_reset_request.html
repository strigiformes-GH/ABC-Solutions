{% extends 'base.html' %}{% block content %}
<section class="card auth-card app-card">
  <h1>Request a Password Reset</h1>
  {% if submitted %}
  <p class="alert alert-success" role="status">
    If an account exists, a manager or admin will review the request.
  </p>
  {% else %}
  <p>
    Enter your username or email.
  </p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
      for="identifier"
      >Username or Email</label
    ><input
      id="identifier"
      name="username_or_email"
      required
      class="form-control"
    /><button class="mt-3 btn btn-primary">Request Reset</button>
  </form>
  {% endif %}
  <p class="mt-3"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</section>
{% endblock %}

{% extends 'base.html' %}{% block content %}
<section class="card auth-card app-card">
  <h1>Log in</h1>
  <p class="note">Sign in to your account.</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
      for="username"
      >Username or Email</label
    ><input
      id="username"
      name="username"
      autocomplete="username"
      required
      class="form-control"
    /><label for="password">Password</label
    ><input
      id="password"
      type="password"
      name="password"
      autocomplete="current-password"
      required
      class="form-control"
    /><button class="mt-3 btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="mt-3">
    <a href="{{ url_for('auth.password_reset_request') }}">Forgot password?</a>
    | <a href="{{ url_for('auth.register') }}">Request an Account</a>
  </p>
</section>
{% endblock %}

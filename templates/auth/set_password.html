{% extends 'base.html' %}{% block content %}
<section class="card auth-card app-card">
  <h1>Set a New Password</h1>
  {% if expired %}
  <p>This reset link is invalid or expired. Request another reset.</p>
  <a class="btn btn-primary" href="{{ url_for('auth.password_reset_request') }}"
    >Request Reset</a
  >{% else %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
      for="password"
      >New Password (12+ Characters)</label
    ><input
      id="password"
      type="password"
      name="password"
      minlength="12"
      required
      class="form-control"
    /><label for="confirm">Confirm New Password</label
    ><input
      id="confirm"
      type="password"
      name="confirm_password"
      minlength="12"
      required
      class="form-control"
    /><button class="mt-3 btn btn-primary">Reset Password</button>
  </form>
  {% endif %}
</section>
{% endblock %}

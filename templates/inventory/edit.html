{% extends 'base.html' %}{% block content %}
<h1>{{ 'Edit Item' if item else 'Add an Item' }}</h1>
<form
  class="card auth-card app-card"
  method="post"
  action="{{ url_for('features.inventory_save') }}"
>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />{% if item
  %}<input type="hidden" name="item_id" value="{{ item.item_id }}" />{% endif %}
  <label for="sku">SKU</label
  ><input
    id="sku"
    name="sku"
    maxlength="100"
    value="{{ item.sku if item else '' }}"
    required
    class="form-control"
  />
  <label for="name">Item Name</label
  ><input
    id="name"
    name="name"
    maxlength="255"
    value="{{ item.name if item else '' }}"
    required
    class="form-control"
  />
  <label for="description">Description</label
  ><textarea id="description" name="description" class="form-control">
{{ item.description if item and item.description else '' }}</textarea
  >
  <label for="price">Price (£)</label
  ><input
    id="price"
    name="price"
    type="number"
    min="0"
    max="100000"
    step="0.01"
    value="{{ item.price if item else '0.00' }}"
    required
    class="form-control"
  />
  {% if can_edit_stock %}
  <div class="app-row">
    <div>
      <label for="quantity">Quantity</label
      ><input
        id="quantity"
        name="quantity"
        type="number"
        min="0"
        max="1000000"
        value="{{ item.quantity if item else 0 }}"
        required
        class="form-control"
      />
    </div>
    <div>
      <label for="reorder">Low-Stock Threshold</label
      ><input
        id="reorder"
        name="reorder_level"
        type="number"
        min="0"
        max="1000000"
        value="{{ item.reorder_level if item else 0 }}"
        required
        class="form-control"
      />
    </div>
  </div>
  {% else %}<input
    type="hidden"
    name="quantity"
    value="{{ item.quantity if item else 0 }}"
  /><input
    type="hidden"
    name="reorder_level"
    value="{{ item.reorder_level if item else 0 }}"
  />
  {% endif %} <button class="mt-3 btn btn-primary">Save Item</button>
  <a class="btn btn-secondary" href="{{ url_for('app_inventory') }}">Cancel</a>
</form>
{% endblock %}

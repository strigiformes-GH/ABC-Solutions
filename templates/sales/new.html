{% extends 'base.html' %}{% block content %}
<h1>New Sale</h1>
<form
  class="card app-card"
  method="post"
  action="{{ url_for('features.sale_create') }}"
  id="sale-form"
>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <input type="hidden" name="submission_token" value="{{ submission_token }}" />
  <div class="row g-3">
    <div class="col-12 col-lg-8">
      <label for="sale-customer">Customer (optional)</label>
      <select id="sale-customer" name="customer_id" class="form-select">
        <option value="">Walk-in (default)</option>
        {% for customer in customers %}
        <option
          value="{{ customer.customer_id }}"
          {% if selected_customer_id|string == customer.customer_id|string %}selected{% endif %}
        >
          {{ customer.name }}
        </option>
        {% endfor %}
      </select>
      <h2 class="mt-3">Add Items</h2>
      <div id="sale-lines">
        {% for row in line_rows %}{% set index = row - 1 %}
        <div class="sale-line row g-3 align-items-end" data-line="{{ index }}">
          <div class="col-12 col-md-6">
            <label for="sale-item-{{ index + 1 }}">Item {{ row }}</label>
            <select
              id="sale-item-{{ index + 1 }}"
              name="item_id"
              class="form-select"
            >
              <option value="">Select an Item</option>
              {% for item in inventory_items %}
              <option value="{{ item.item_id }}" {% if selected_items|length>
                index and selected_items[index]|string == item.item_id|string
                %}selected{% endif %}>{{ item.name }} ({{ item.sku }}) — £{{
                item.price }} | {{ item.quantity }} available
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label for="sale-quantity-{{ index + 1 }}">Quantity</label>
            <input
              id="sale-quantity-{{ index + 1 }}"
              name="quantity"
              type="number"
              min="1"
              max="10000"
              inputmode="numeric"
              class="form-control"
              value="{{ selected_quantities[index] if selected_quantities|length > index else '' }}"
            />
          </div>
          <div class="col-6 col-md-3 sale-line-action">
            <button
              class="btn btn-secondary remove-sale-line w-100"
              type="button"
            >
              Remove
            </button>
          </div>
        </div>
        {% endfor %}
      </div>
      <div class="actions mt-3">
        <button class="btn btn-secondary" type="button" id="add-sale-line">
          + Add Item
        </button>
        <button class="btn btn-primary" type="submit">Complete Sale</button>
      </div>
    </div>
    <aside class="col-12 col-lg-4">
      <div class="card app-card h-100">
        <h2>Sale Summary</h2>
        <p class="fw-semibold">Complete the sale to record it.</p>
      </div>
    </aside>
  </div>
</form>
{% endblock %} {% block scripts %}
<script
  src="{{ url_for('static', filename='js/sale-form.js') }}"
  defer
></script>
{% endblock %}

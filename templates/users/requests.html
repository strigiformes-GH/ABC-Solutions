{% extends 'base.html' %}{% block content %}
<h1>Account Requests</h1>
<div class="table-frame table-responsive">
  <table class="table table-striped align-middle">
    <caption>
      Inactive Account Requests
    </caption>
    <thead>
      <tr>
        <th>Name</th>
        <th>Requested role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for row in account_requests %}
      <tr>
        <th>{{ row.name }}</th>
        <td>{{ row.role }}</td>
        <td>
          <form
            method="post"
            action="{{ url_for('features.activate_user', user_id=row.user_id) }}"
          >
            <input
              type="hidden"
              name="csrf_token"
              value="{{ csrf_token() }}"
            /><button class="btn btn-primary">Activate</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr>
        <td colspan="3">No pending requests.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}

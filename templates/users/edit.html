{% extends 'base.html' %}{% block content %}
<h1>Edit User Access</h1>
<section class="card auth-card app-card">
  <p>
    <strong>{{ user.first_name }} {{ user.last_name }}</strong><br />{{
    user.username }} | {{ user.email }}
  </p>
  <form
    method="post"
    action="{{ url_for('features.admin_user_update', user_id=user.user_id) }}"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
      for="user-role"
      >Role</label
    ><select id="user-role" name="role" class="form-select">
      {% for role in roles %}
      <option
        value="{{ role.name }}"
        {% if role.role_id == user.role_id %}selected{% endif %}
      >
        {{ role.name }}
      </option>
      {% endfor %}</select
    ><button class="mt-3 btn btn-primary">Save Role</button>
  </form>
  <hr />
  <div class="actions">
    <form
      method="post"
      action="{{ url_for('auth.reset_user_mfa', user_id=user.user_id) }}"
    >
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      /><button class="btn btn-secondary">Reset MFA</button>
    </form>
    <form
      method="post"
      action="{{ url_for('auth.unlock_user', user_id=user.user_id) }}"
    >
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      /><button class="btn btn-secondary">Unlock Account</button>
    </form>
  </div>
</section>
{% endblock %}
